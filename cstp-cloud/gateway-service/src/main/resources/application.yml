server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      routes:
        # 用户服务路由
        - id: user-route
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        # 商品服务路由
        - id: goods-route
          uri: lb://goods-service
          predicates:
            - Path=/api/goods/**
          filters:
            - StripPrefix=1
        # 静态资源（商品图片/头像）
        - id: uploads-route
          uri: lb://goods-service
          predicates:
            - Path=/uploads/**
        # 订单服务路由
        - id: order-route
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1
        # 聊天服务路由（HTTP 接口）
        - id: chat-route
          uri: lb://chat-service
          predicates:
            - Path=/api/chat/**
          filters:
            - StripPrefix=1
        # 聊天服务路由（WebSocket 长连接）
        - id: chat-ws-route
          uri: lb:ws://chat-service
          predicates:
            - Path=/ws/**
