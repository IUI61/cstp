spring:
  application:
    name: CSTP
  # 激活 local 配置：数据库密码等本地敏感信息放在 application-local.yml（该文件不提交到Git）
  profiles:
    active: local
  #文件大小限制
  servlet:
    multipart:
      max-file-size: 2MB       # 单张图片上限
      max-request-size: 15MB   # 一次可发多张图，请求体上限别用默认的 10MB
  # ========== MySQL 数据源 ==========
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cstp?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    # 数据库密码见 application-local.yml（本地文件，已在.gitignore中忽略）

  # ========== Redis ==========
  data:
    redis:
      host: localhost
      port: 6379
      # password: 你的Redis密码（如果没有设置密码就注释掉）

# ========== MyBatis-Plus ==========
mybatis-plus:
  configuration:
    # 控制台打印 SQL 日志（开发时打开方便调试）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 驼峰命名自动映射（数据库 user_name → Java userName）
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 逻辑删除字段（对应你表中的 is_delete）
      logic-delete-field: isDelete
      logic-delete-value: 1    # 已删除
      logic-not-delete-value: 0 # 未删除

# ========== 服务端口 ==========
server:
  port: 8080

# ========== Knife4j接口文档 ==========
knife4j:
  enable: true
  setting:
    language: zh_cn

# ========== 上传目录 ==========
cstp:
  upload:
    # 默认放用户主目录，与启动目录（user.dir）无关；部署时可用环境变量覆盖，如 CSTP_UPLOAD_DIR=D:/data/cstp/uploads
    base-dir: ${CSTP_UPLOAD_DIR:${user.home}/cstp/uploads}
